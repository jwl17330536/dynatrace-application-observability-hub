name: Repo Boundary Check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  boundary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no private repo coupling
        run: |
          set -euo pipefail
          if git grep -nE "dynatrace-infrastructure-observability-framework|dt_infrastructure_adapters" -- . \
            ':(exclude).github/workflows/repo-boundary-check.yml' \
            ':(exclude)**/*.md'; then
            echo "Found forbidden cross-repo dependency reference."
            exit 1
          fi
          echo "Boundary check passed."
