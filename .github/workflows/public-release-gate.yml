name: Public Release Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pii-and-secret-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run strict public hygiene gate
        env:
          STRICT_PUBLIC_GATE: "true"
        run: bash scripts/repo-hygiene-check.sh
